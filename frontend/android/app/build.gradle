apply plugin: 'com.android.application'
// As telas nativas (mobile-docs/native-app.md): Kotlin ao lado do Java de sempre, e o Compose.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// A chave de assinatura mora fora do repositorio (mobile/new-keystore.ps1 cria as duas
// coisas): o .jks e um keystore.properties com storeFile, storePassword, keyAlias e
// keyPassword. FINANCAS_KEYSTORE_PROPERTIES aponta para outro lugar, se preciso.
def keystorePropertiesFile = file(System.getenv('FINANCAS_KEYSTORE_PROPERTIES')
    ?: "${System.getProperty('user.home')}/.financas-android/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// No CI (job "apk" de .github/workflows/deploy.yml) a mesma chave vem do ambiente: o .jks
// decodificado num arquivo temporario e as senhas dos secrets, sem arquivo de propriedades.
if (System.getenv('FINANCAS_KEYSTORE_FILE')) {
    keystoreProperties['storeFile'] = System.getenv('FINANCAS_KEYSTORE_FILE')
    keystoreProperties['storePassword'] = System.getenv('FINANCAS_KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('FINANCAS_KEY_ALIAS')
    keystoreProperties['keyPassword'] = System.getenv('FINANCAS_KEY_PASSWORD')
}
def hasReleaseKey = keystoreProperties['storeFile'] != null

android {
    namespace = "br.financas.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.financas.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Quem builda passa os dois: o CI (10000 + numero da execucao, data+commit) e
        // mobile/build-apk.ps1 (contagem de commits). O app oferece o APK publicado quando o
        // versionCode dele e maior que o instalado (update/ApkUpdatePlugin.java).
        versionCode((project.findProperty('financasVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('financasVersionName') ?: 'dev') as String)
        // A tela baixada do servidor so entra num APK deste nivel ou acima (frontend/native-level.txt,
        // bundle/BundleRules.java). Mudou o Java, um plugin ou o Capacitor: sobe o numero.
        buildConfigField "int", "NATIVE_LEVEL", file('../../native-level.txt').text.trim()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    buildTypes {
        // O APK de teste: outro pacote (br.financas.app.debug), instalado ao lado do de verdade e
        // nunca por cima dele. So ele aceita as notificacoes do shell do adb (notify/NotifyRules,
        // BuildConfig.DEBUG). Assinado com a mesma chave quando ela existe, para que um debug
        // novo instale por cima do anterior.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// O mesmo alvo do Java (capacitor.build.gradle): Kotlin e Java tem de concordar.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // O envio da fila com o app fechado (outbox/OutboxWorker.java).
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    // As telas nativas (ui/).
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:$junitVersion"
    // O org.json do Android e so um esboco na JVM; os testes de OutboxRules usam o real.
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
