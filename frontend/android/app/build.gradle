apply plugin: 'com.android.application'
// As telas nativas (mobile-docs/native-app.md): Kotlin ao lado do Java de sempre, e o Compose.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// A chave de assinatura mora fora do repositorio (mobile/new-keystore.ps1 cria as duas
// coisas): o .jks e um keystore.properties com storeFile, storePassword, keyAlias e
// keyPassword. FINANCAS_KEYSTORE_PROPERTIES aponta para outro lugar, se preciso.
def keystorePropertiesFile = file(System.getenv('FINANCAS_KEYSTORE_PROPERTIES')
    ?: "${System.getProperty('user.home')}/.financas-android/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// No CI (job "apk" de .github/workflows/deploy.yml) a mesma chave vem do ambiente: o .jks
// decodificado num arquivo temporario e as senhas dos secrets, sem arquivo de propriedades.
if (System.getenv('FINANCAS_KEYSTORE_FILE')) {
    keystoreProperties['storeFile'] = System.getenv('FINANCAS_KEYSTORE_FILE')
    keystoreProperties['storePassword'] = System.getenv('FINANCAS_KEYSTORE_PASSWORD')
    keystoreProperties['keyAlias'] = System.getenv('FINANCAS_KEY_ALIAS')
    keystoreProperties['keyPassword'] = System.getenv('FINANCAS_KEY_PASSWORD')
}
def hasReleaseKey = keystoreProperties['storeFile'] != null

android {
    namespace = "br.financas.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.financas.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Quem builda passa os dois: o CI (10000 + numero da execucao, data+commit) e
        // mobile/build-apk.ps1 (contagem de commits). O app oferece o APK publicado quando o
        // versionCode dele e maior que o instalado (update/ApkUpdatePlugin.java).
        versionCode((project.findProperty('financasVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('financasVersionName') ?: 'dev') as String)
        // O servidor do login nativo (ui/login/) e do APK novo; o CI passa -PfinancasApiBase (o
        // API_BASE de deploy.yml), e o padrao e o mesmo endereco. So https.
        buildConfigField "String", "API_BASE_URL", "\"${(project.findProperty('financasApiBase') ?: 'https://guilhermeserver.tail5084ff.ts.net')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    // Java e Kotlin no mesmo alvo (o jvmTarget abaixo): os dois tem de concordar.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        // O APK de teste: outro pacote (br.financas.app.debug), instalado ao lado do de verdade e
        // nunca por cima dele. So ele aceita as notificacoes do shell do adb (notify/NotifyRules,
        // BuildConfig.DEBUG). Assinado com a mesma chave quando ela existe, para que um debug
        // novo instale por cima do anterior.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // O envio da fila com o app fechado (outbox/OutboxWorker.java).
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    // As telas nativas (ui/).
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    // A camada de dados (data/): ApiClient, ReadCache e os repositorios.
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$androidxLifecycleVersion"
    // As paginas nativas (Aprovar e as seguintes): o NavHost e o ciclo de vida no Compose.
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$androidxLifecycleVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinxCoroutinesVersion"
    testImplementation "junit:junit:$junitVersion"
    // O org.json do Android e so um esboco na JVM; os testes de OutboxRules usam o real.
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
