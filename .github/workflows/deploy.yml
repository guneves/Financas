# Push to main: test, build the image into GHCR, deploy it on guilhermeserver.
# The server only pulls: /srv/apps/financas holds compose.yaml and .env (never touched here).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/guneves/financas-app
  SERVER: guilherme@guilhermeserver.tail5084ff.ts.net
  APP_DIR: /srv/apps/financas

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm test
        working-directory: frontend

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # Tailscale SSH authorizes by the policy's ssh rule (tag:ci -> tag:server as guilherme):
      # no private key here. Its host key is new on every runner.
      - name: Copy compose.yaml (never .env)
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$SERVER" \
            "cat > $APP_DIR/compose.yaml.new && mv $APP_DIR/compose.yaml.new $APP_DIR/compose.yaml" < compose.yaml
      - name: Pull and restart
        run: |
          ssh "$SERVER" "cd $APP_DIR && sudo docker compose pull && sudo docker compose up -d && sudo docker image prune -f > /dev/null && sudo docker compose ps"
